# Settings of calc/emi_check.py (diff pair, edge fence, antenna, planes, loops, parallel runs). Each limit names its source.
# Template placeholders removed: no USB pair on this board (no pair_* keys), no switch-node net or "NET*/SW*" parallel rule declared yet.
# No antenna, regulator or switch node on this board; the layout builder adds edge_exempt rectangles (holes, header) with the routed board.
# Numeric settings below are emi_check.py's own defaults, written out so a reader sees them (no board-specific source yet).
edge_pitch_mm: 5.0          # GND via fence along the board edge: largest gap between neighbouring vias
edge_band_mm: 1.6
void_max_mm: 1.0            # longest signal run over a plane void
loop_max_mm: 12.0
sw_nets: []                 # switch-node nets (full KiCad names)
sw_area_max_mm2: 3.0
parallel: []                # {name, victims: [net globs], aggressors: [net globs], gap_mm, max_mm}
edge_exempt: []             # rectangles with a reason: antenna, holes, overhangs, module pad columns, corners
known: []                   # row + reason + the fix for next time
