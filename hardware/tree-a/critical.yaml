# Critical blocks, declared by intent; checked by calc/critical.py (--placement before routing). Pins are REF.PAD from the
# generated netlist; distances in mm, PAD CENTRE to PAD CENTRE (calc/pcb.py Board.dist). Limits are design targets unless a
# source is named. `known:` on an entry turns a FAIL into a WARN with the reason. EMI settings live in emi.yaml.
# No USB pair on this board (USB-C of variant B is power only), no feedback divider (TPS63900 set by CFG resistors), no sensor.
# Sources:
#   NRF = parts/nRF54L15-QFAA.yaml reference_layout_distances_mm (Nordic QFAA reference layout v0.8, measured from the
#         drawing): decoupling 0.74-1.2 from the pin, C1 0.9 from DECD, L1 2.2-2.5 from DCC, C6 0.86 from pin 32, the series
#         L at ANT 0.86, C13 0.88 from nRESET, X2 2.1-3.5 from XC pins, X1 1.8-2.1 from XL pins
#   TI  = TPS63900 SLVSET3D section 10 layout guidelines / Figure 10-1 (Cin and Cout next to VIN / VOUT and GND, inductor
#         across LX1 / LX2); limits here are own targets in the spirit of that figure, not printed numbers
# Crystal, RF-chain and net-tie rows are written as `decoupling` / `series_termination` entries because critical.py has no
# crystal / RF key yet (proposed extension in the gate 4 report); the row label then reads "decoupling X2" etc.
switcher_loop:
  # TI: input loop Cin - VIN - GND; GND = exposed pad 11 (pad centre; its edge is about 1 mm closer than the centre)
  - {name: tps63900_in, cin: "C20", vin: "U2.10", gnd: "U2.11", max_mm: 3.5, sw: "U2.9", inductor: "L2.1", sw_max_mm: 2.5}
  # TI: output loop Cout - VOUT - GND, LX2 side of the inductor
  - {name: tps63900_out, cin: "C21", vin: "U2.6", gnd: "U2.11", max_mm: 3.5, sw: "U2.7", inductor: "L2.2", sw_max_mm: 2.5}
feedback: []
decoupling:
  - {pin: "U1.48", cap: "C10.1", max_mm: 1.2}     # NRF decoupling 0.74-1.2 (VDD 47/48)
  - {pin: "U1.22", cap: "C8.1", max_mm: 1.2}      # NRF
  - {pin: "U1.33", cap: "C5.1", max_mm: 1.2, known: "1.29 mm: C5 stands upright in row A above the RF-side pad row (U1 rot 90, D10 forces x >= 33.9); 0.09 over the reference span"}
  - {pin: "U1.36", cap: "C4.1", max_mm: 1.2, known: "2.14 mm: VDD 36 sits between XC2 (35) and the corner; X2 takes the space above pins 34-36, C4 goes round the corner"}
  - {pin: "U1.10", cap: "C7.1", max_mm: 1.2, known: "2.72 mm: pin 10 is on the bottom row facing J3 (0.02 mm courtyard gap), C7 sits at the bottom-right corner; C3 10 uF and C8 share the VDD node on the right side"}
  - {pin: "U1.45", cap: "C1.1", max_mm: 0.9, known: "2.05 mm: L1 takes the slot at pins 45/46 (DCC first, NRF L1 2.2-2.5), C1 one row above"}
  - {pin: "U1.43", cap: "C12.1", max_mm: 1.2, known: "3.66 mm: DECA also has C5 at pin 33 (1.29 mm); the left power cluster puts C12 above L1 / FB1. Re-check at routing: DECA trace via FB1"}
  - {pin: "U1.46", cap: "L1.1", max_mm: 2.5}      # NRF L1 2.2-2.5 from DCC
  - {pin: "U1.30", cap: "C13.1", max_mm: 0.88, known: "4.02 mm: the top band above pins 30-33 holds the RF chain; C13 (nRESET filter, a slow node) sits at the top-right corner"}
  - {pin: "U1.5", cap: "C14.1", max_mm: 3.0, known: "12.85 mm: pin 5 faces J3, no room at the pin; C14 sits with R40/R41 in the left header strip. Own target 3 mm (ADC input cap of a 1.1 Mohm source); risk: pickup on a 13 mm high-impedance trace, route it over GND away from LED lines"}
  # crystals (as decoupling rows, see header): HFXO X2 at XC1/XC2, LFXO X1 at XL1/XL2
  - {pin: "U1.34", cap: "X2.1", max_mm: 3.5}      # NRF X2 2.1-3.5
  - {pin: "U1.35", cap: "X2.3", max_mm: 3.5}      # NRF
  - {pin: "U1.1", cap: "X1.1", max_mm: 2.1, known: "5.60 mm: pins 1/2 sit on the bottom row facing J3 (no room below); X1 at the bottom-left corner, traces along the 1.4 mm channel between U1 and J3. 32.768 kHz is the slow clock: trace capacitance adds to the load (re-check the internal load-cap setting at bring-up). Option: engineer accepts, or moves X1 if the LED D10 position changes"}
  - {pin: "U1.2", cap: "X1.2", max_mm: 2.1, known: "4.60 mm: as X1.1"}
  # RF chain at the ANT pin (as series rows, see header)
series_termination:
  - {source: "U1.31", part: "L3.1", max_mm: 0.86, known: "1.25 mm: L3 in row A right above the ANT pin (U1 courtyard to row A courtyard 0 mm); 0.39 over the reference"}
  - {source: "U1.32", part: "C6.2", max_mm: 0.86, known: "2.26 mm: C6 in row B behind L3 (VSS_PA also goes to the exposed pad through NT1, 0.31 mm); reference has C6 beside the pin"}
  - {source: "U1.32", part: "NT1.1", max_mm: 0.5}   # D25 bridge in the pad-32 to exposed-pad gap
  - {source: "C9.2", part: "NT2.1", max_mm: 1.5}    # D21: GND_C9 via straight down to the bottom-layer net tie
diff_pair: []
thermal_distance: []
