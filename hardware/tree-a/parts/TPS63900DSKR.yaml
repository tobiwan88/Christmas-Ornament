alternates_discussed:
  - "none for the converter itself"
checklist:
  - "decoupling: Cin 10 uF at VIN/GND (6.3 CI >= 5 uF effective; Table 8-4 lists 10 uF 10 V 0603 X5R: C19702 CL10A106KP8NNNC is that class), Cout 22 uF (6.3 CO >= 10 uF effective; 8.2.2.3; C45783 22 uF 25 V 0805 X5R keeps more capacitance at 3.5 V than the 6.3 V 0603 in Table 8-3), both on the top layer next to the pins (10.1)"
  - "enable/reset: EN, SEL, CFG1-3 never float (Table 5-1); EN to VIN or a GPIO with a pull; SEL pulled down (state during start-up not stated; SEL low = the Table 7-3 preset, 3.0 V); CFG resistors 1 %, 200 ppm, 511 ohm / 10.5 k / 13.3 k (Tables 7-2, 7-3)"
  - "inductor 2.2 uH, Isat >= 1 A for a <= 100 mA setting (6.3); C23894 SWPA252012S2R2MT Isat 1.85 A min / 2.07 A typ (see its card)"
  - "layout notes -> critical.yaml: short wide top-layer loops VIN-Cin-GND and VOUT-Cout-GND, inductor may sit after the caps and be routed on an inner layer (10.1); thermal pad to GND with vias (Table 5-1 'connect to ground for correct operation'; package note 4 of the land page says solder to the thermal pad); the digest's 'thermal pad soldered (10.1)' is not in 10.1 text, the statement is Table 5-1 + page 38 note 4"
  - "no active discharge: firmware sets SEL low in good time before sleep (7.3.5); numbers from calc/tree_power.py"
  - "UVLO: rising 1.73-1.77 V, falling about 1.65 V; cell sag under the LED load pulses can cause on/off cycling at end of life; firmware cut-off above 1.8 V (7.4, 6.5)"
