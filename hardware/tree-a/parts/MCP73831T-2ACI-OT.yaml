checklist:
  - "decoupling: 4.7 uF on VDD, 4.7 uF on VBAT (3.1, 3.2; the 4.7 uF value is the minimum, so the DC-bias derating at 5 V and 4.2 V must be checked on the chosen capacitor: card of the capacitor not written, schematic builder to pick a >= 10 V part and check)"
  - "enable: PROG resistor to VSS enables; floating or high disables (5.2.2); RPROG 10 k 1 % gives 100 mA (5.1.2); the 0402 10 k is the Basic C25744"
  - "STAT is tri-state push-pull, not open drain: to a GPIO it needs no pull-up, but the High-Z phase (shutdown, no battery) needs a firmware-side pull or a read with the internal pull enabled (Table 5-1); level up to VDD - 0.4 V at 4 mA (1.0 STAT table); VDD is the USB VBUS (up to 5.25 V), the nRF pin limit is VDD + 0.3 V = 3.8 V at 3.5 V: a direct connection is not allowed, divider or level shifter needed: see PARTS-REVIEW"
  - "thermal: dissipation (VDD - VBAT) x I computed by calc/tree_power.py; SOT-23-5 130-230 C/W"
  - "layout notes -> critical.yaml: battery pack close to VBAT/VSS (6.2 PCB Layout Issues); no exposed pad on SOT-23-5"
