checklist:
  - "gate drive: VGS = -VIN, minimum -1.8 V at the UVLO end (1.65-1.8 V): threshold max -1.0 V, margin 0.8 V; RDS(on) at -1.8 V not tabulated (EST 0.13 ohm typ): calc/tree_power.py uses 0.20 ohm"
  - "drop at 40 mA and 500 mA start-up peak from calc/tree_power.py (printed with the check run)"
  - "decoupling: none needed on the FET; the TPS63900 input capacitor sits behind it"
  - "layout: nothing thermal (millwatt dissipation): SOT-23 land per the fab footprint"
